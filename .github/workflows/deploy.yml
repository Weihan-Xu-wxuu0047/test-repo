name: Deploy Lambdas

on:
  push:
    branches:
      - new-branch
    paths:
      - 'test-lambda/**'
      - 'test-lambda2/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'test-lambda/**'
      - 'test-lambda2/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambdas-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-2
  PYTHON_VERSION: "3.14"
  AWS_ROLE_ARN: arn:aws:iam::718036735780:role/github-lambda-deploy-role-weihan

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: test-lambda
            function_name: test-lambda
          - folder: test-lambda2
            function_name: test-lambda2

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show folder contents
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping runtime dependency install"
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "No requirements-dev.txt found, skipping dev dependency install"
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found, skipping tests"
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/new-branch'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: test-lambda
            function_name: test-lambda
          - folder: test-lambda2
            function_name: test-lambda2

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build deployment package
        run: |
          rm -rf package lambda.zip
          mkdir -p package

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -t package/
          else
            echo "No requirements.txt found, packaging code only"
          fi

          if [ -d src ]; then
            cp -r src/* package/
          fi

          cp -r *.py package/ 2>/dev/null || true

          if [ ! -f package/lambda_function.py ] && [ ! -d package ]; then
            echo "Package build appears invalid"
            exit 1
          fi

          cd package
          zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.function_name }}" \
            --zip-file fileb://lambda.zip

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name "${{ matrix.function_name }}"